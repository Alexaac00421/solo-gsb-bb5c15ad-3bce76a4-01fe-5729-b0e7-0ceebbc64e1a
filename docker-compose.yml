services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: duty
      POSTGRES_PASSWORD: duty
      POSTGRES_DB: duty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duty -d duty"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://duty:duty@db:5432/duty
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  pgdata:
